services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  websocket:
    build:
      context: .
      dockerfile: docker/Dockerfile.websocket
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      network: host
      args:
        DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@localhost:5434/postgres
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
